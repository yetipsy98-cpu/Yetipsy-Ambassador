<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yetipsy Admin</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div class="topbar"><div><div class="brand">Admin</div><div class="sub">Hi, <span id="who"></span></div></div><button class="btn2" onclick="logout()">Logout</button></div><div id="notice"></div>
<div class="grid g3"><div class="card compact-card"><div class="label">Total Sales</div><div id="tsales" class="stat">RM0</div></div><div class="card compact-card"><div class="label">Commission</div><div id="tcomm" class="stat">RM0</div></div><div class="card compact-card"><div class="label">Checked-in Pax</div><div id="tpax" class="stat">0</div></div></div>
<div class="grid g2" style="margin-top:12px"><div class="card compact-card"><h3 class="section-title">Default Pricing</h3><div class="muted small">Normal Day = Sun–Thu · Weekend = Fri–Sat</div><div class="compact-grid two tight"><label>Normal Male<input id="normalMale" type="number" min="0" step="0.01"></label><label>Normal Female<input id="normalFemale" type="number" min="0" step="0.01"></label><label>Weekend Male<input id="weekendMale" type="number" min="0" step="0.01"></label><label>Weekend Female<input id="weekendFemale" type="number" min="0" step="0.01"></label></div><button onclick="saveDefaults()" style="margin-top:10px">Save Defaults</button></div>
<div class="card compact-card"><h3 class="section-title">Special Date Override</h3><label>Date<input id="priceDate" type="date"></label><div class="compact-grid two"><label>Male Price<input id="priceMale" type="number" min="0" step="0.01"></label><label>Female Price<input id="priceFemale" type="number" min="0" step="0.01"></label></div><label>Note<input id="priceNote" placeholder="e.g. Event Night"></label><button onclick="saveOverride()" style="margin-top:10px">Save Override</button></div></div>
<div class="grid g2" style="margin-top:12px"><div class="card compact-card"><h3 class="section-title">Date Overrides</h3><div id="overrideList" class="table-scroll"></div></div><div class="card compact-card"><h3 class="section-title">Create Ambassador</h3><div class="compact-grid two"><label>Name<input id="aname"></label><label>Username<input id="auser"></label><label>Password<input id="apass" type="password"></label><label>Commission %<input id="arate" type="number" step="0.01" value="8"></label></div><button onclick="createAmb()" style="margin-top:10px">Create</button></div></div>
<div class="card compact-card" style="margin-top:12px"><h3 class="section-title">Ambassadors</h3><div id="alist" class="table-scroll"></div></div><div class="card compact-card" style="margin-top:12px"><h3 class="section-title">Recent Redeems</h3><div id="rlist" class="table-scroll"></div></div></div>
<script src="config.js"></script><script src="app.js"></script><script>
if(requireRole('admin')){setToday('#priceDate');load()}
async function load(){try{const [d,defs,overrides]=await Promise.all([api('adminDashboard'),api('getPricingDefaults'),api('listDateOverrides')]);$('#tsales').textContent=money(d.total_sales);$('#tcomm').textContent=money(d.total_commission);$('#tpax').textContent=d.total_pax;$('#normalMale').value=defs.normal_male_price??'';$('#normalFemale').value=defs.normal_female_price??'';$('#weekendMale').value=defs.weekend_male_price??'';$('#weekendFemale').value=defs.weekend_female_price??'';$('#alist').innerHTML=`<table><tr><th>Name</th><th>User</th><th>Rate</th><th>Wallet</th></tr>${d.ambassadors.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.username)}</td><td>${Number(a.commission_rate||0)}%</td><td>${money(a.wallet)}</td></tr>`).join('')}</table>`;$('#rlist').innerHTML=`<table><tr><th>Ref</th><th>Amb.</th><th>M/F</th><th>Sales</th><th>Comm.</th></tr>${d.redeems.map(r=>`<tr><td>${esc(r.redeem_ref)}</td><td>${esc(r.ambassador_name)}</td><td>${Number(r.male_charged||0)}/${Number(r.female_charged||0)}</td><td>${money(r.sales_amount)}</td><td>${money(r.commission_amount)}</td></tr>`).join('')}</table>`;$('#overrideList').innerHTML=`<table><tr><th>Date</th><th>Male</th><th>Female</th><th></th></tr>${overrides.map(x=>`<tr><td>${esc(x.price_date)}</td><td>${money(x.male_price)}</td><td>${money(x.female_price)}</td><td><button class="danger" onclick="delOverride('${x.price_id}')">Delete</button></td></tr>`).join('')}</table>`}catch(e){toast(e.message,'error')}}
async function saveDefaults(){try{await api('savePricingDefaults',{normal_male_price:$('#normalMale').value,normal_female_price:$('#normalFemale').value,weekend_male_price:$('#weekendMale').value,weekend_female_price:$('#weekendFemale').value});toast('Defaults saved','success');load()}catch(e){toast(e.message,'error')}}
async function saveOverride(){try{await api('saveDateOverride',{price_date:$('#priceDate').value,male_price:$('#priceMale').value,female_price:$('#priceFemale').value,note:$('#priceNote').value});toast('Override saved','success');$('#priceMale').value='';$('#priceFemale').value='';$('#priceNote').value='';load()}catch(e){toast(e.message,'error')}}
async function delOverride(id){if(!confirm('Delete this date override?'))return;try{await api('deleteDateOverride',{price_id:id});toast('Deleted','success');load()}catch(e){toast(e.message,'error')}}
async function createAmb(){try{await api('createAmbassador',{name:$('#aname').value,username:$('#auser').value,password:$('#apass').value,commission_rate:$('#arate').value});toast('Ambassador created','success');$('#apass').value='';$('#aname').value='';$('#auser').value='';load()}catch(e){toast(e.message,'error')}}
</script></body></html>
