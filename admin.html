<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div class="topbar"><div><div class="brand">Admin</div><div class="sub">Hi, <span id="who"></span></div></div><button class="btn2" onclick="logout()">Logout</button></div><div id="notice"></div>
<div class="grid g3"><div class="card"><div class="label">Total Sales</div><div id="tsales" class="stat">RM0</div></div><div class="card"><div class="label">Commission Credited</div><div id="tcomm" class="stat">RM0</div></div><div class="card"><div class="label">Checked-in Pax</div><div id="tpax" class="stat">0</div></div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Create Ambassador</h3><label>Name<input id="aname"></label><label>Username<input id="auser"></label><label>Password<input id="apass" type="password"></label><label>Commission %<input id="arate" type="number" step="0.01" value="8"></label><button onclick="createAmb()" style="margin-top:12px">Create</button></div><div class="card"><h3>Ambassadors</h3><div id="alist"></div></div></div>
<div class="card" style="margin-top:16px"><h3>Recent Redeems</h3><div id="rlist"></div></div></div>
<script src="config.js"></script><script src="app.js"></script><script>if(requireRole('admin'))load();async function load(){try{const d=await api('adminDashboard');$('#tsales').textContent=money(d.total_sales);$('#tcomm').textContent=money(d.total_commission);$('#tpax').textContent=d.total_pax;$('#alist').innerHTML=`<table><tr><th>Name</th><th>User</th><th>Rate</th><th>Wallet</th></tr>${d.ambassadors.map(a=>`<tr><td>${a.name}</td><td>${a.username}</td><td>${a.commission_rate}%</td><td>${money(a.wallet)}</td></tr>`).join('')}</table>`;$('#rlist').innerHTML=`<table><tr><th>Ref</th><th>Ambassador</th><th>Sales</th><th>Commission</th><th>Time</th></tr>${d.redeems.map(r=>`<tr><td>${r.redeem_ref}</td><td>${r.ambassador_name}</td><td>${money(r.sales_amount)}</td><td>${money(r.commission_amount)}</td><td>${fmtDate(r.created_at)}</td></tr>`).join('')}</table>`}catch(e){toast(e.message,'error')}}async function createAmb(){try{await api('createAmbassador',{name:$('#aname').value,username:$('#auser').value,password:$('#apass').value,commission_rate:$('#arate').value});toast('Ambassador created','success');load()}catch(e){toast(e.message,'error')}}</script></body></html>
