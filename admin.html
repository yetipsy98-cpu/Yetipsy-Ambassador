<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yetipsy Admin</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div class="topbar"><div><div class="brand">Admin</div><div class="sub">Hi, <span id="who"></span></div></div><button class="btn2" onclick="logout()">Logout</button></div><div id="notice"></div>
<div class="grid g3"><div class="card"><div class="label">Total Sales</div><div id="tsales" class="stat">RM0</div></div><div class="card"><div class="label">Commission Credited</div><div id="tcomm" class="stat">RM0</div></div><div class="card"><div class="label">Checked-in Pax</div><div id="tpax" class="stat">0</div></div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Default Pricing</h3><div class="muted">Normal Day = Sun–Thu · Weekend = Fri–Sat</div><label>Normal Day Price / Pax<input id="normalPrice" type="number" min="0" step="0.01"></label><label>Weekend Price / Pax<input id="weekendPrice" type="number" min="0" step="0.01"></label><button onclick="saveDefaults()" style="margin-top:12px">Save Defaults</button></div><div class="card"><h3>Special Date Override</h3><label>Date<input id="priceDate" type="date"></label><label>Price / Pax (RM)<input id="pricePax" type="number" min="0" step="0.01"></label><label>Note<input id="priceNote" placeholder="e.g. Promo Night"></label><button onclick="saveOverride()" style="margin-top:12px">Save Override</button></div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Override List</h3><div id="overrideList"></div></div><div class="card"><h3>Create Ambassador</h3><label>Name<input id="aname"></label><label>Username<input id="auser"></label><label>Password<input id="apass" type="password"></label><label>Commission %<input id="arate" type="number" step="0.01" value="8"></label><button onclick="createAmb()" style="margin-top:12px">Create</button></div></div>
<div class="card" style="margin-top:16px"><h3>Ambassadors</h3><div id="alist"></div></div>
<div class="card" style="margin-top:16px"><h3>Recent Redeems</h3><div id="rlist"></div></div></div>
<script src="config.js"></script><script src="app.js"></script><script>
if(requireRole('admin')){setToday('#priceDate');load()}
async function load(){try{const [d,defs,overrides]=await Promise.all([api('adminDashboard'),api('getPricingDefaults'),api('listDateOverrides')]);$('#tsales').textContent=money(d.total_sales);$('#tcomm').textContent=money(d.total_commission);$('#tpax').textContent=d.total_pax;$('#normalPrice').value=defs.normal_day_price??'';$('#weekendPrice').value=defs.weekend_price??'';$('#alist').innerHTML=`<table><tr><th>Name</th><th>User</th><th>Rate</th><th>Wallet</th></tr>${d.ambassadors.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.username)}</td><td>${Number(a.commission_rate||0)}%</td><td>${money(a.wallet)}</td></tr>`).join('')}</table>`;$('#rlist').innerHTML=`<table><tr><th>Ref</th><th>Ambassador</th><th>Date</th><th>Price</th><th>Sales</th><th>Commission</th></tr>${d.redeems.map(r=>`<tr><td>${esc(r.redeem_ref)}</td><td>${esc(r.ambassador_name)}</td><td>${esc(String(r.reservation_date||'').slice(0,10))}</td><td>${money(r.price_per_pax)}</td><td>${money(r.sales_amount)}</td><td>${money(r.commission_amount)}</td></tr>`).join('')}</table>`;$('#overrideList').innerHTML=`<table><tr><th>Date</th><th>Price</th><th>Note</th><th></th></tr>${overrides.map(x=>`<tr><td>${esc(x.price_date)}</td><td><b>${money(x.price_per_pax)}</b></td><td>${esc(x.note||'')}</td><td class="right"><button class="danger" onclick="delOverride('${x.price_id}')">Delete</button></td></tr>`).join('')}</table>`}catch(e){toast(e.message,'error')}}
async function saveDefaults(){try{await api('savePricingDefaults',{normal_day_price:$('#normalPrice').value,weekend_price:$('#weekendPrice').value});toast('Defaults saved','success');load()}catch(e){toast(e.message,'error')}}
async function saveOverride(){try{await api('saveDateOverride',{price_date:$('#priceDate').value,price_per_pax:$('#pricePax').value,note:$('#priceNote').value});toast('Override saved','success');$('#pricePax').value='';$('#priceNote').value='';load()}catch(e){toast(e.message,'error')}}
async function delOverride(id){if(!confirm('Delete this date override?'))return;try{await api('deleteDateOverride',{price_id:id});toast('Override deleted','success');load()}catch(e){toast(e.message,'error')}}
async function createAmb(){try{await api('createAmbassador',{name:$('#aname').value,username:$('#auser').value,password:$('#apass').value,commission_rate:$('#arate').value});toast('Ambassador created','success');$('#apass').value='';$('#aname').value='';$('#auser').value='';load()}catch(e){toast(e.message,'error')}}
</script></body></html>
