<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div class="topbar"><div><div class="brand">Staff</div><div class="sub">Hi, <span id="who"></span></div></div><button class="btn2" onclick="logout()">Logout</button></div><div id="notice"></div>
<div class="grid g2"><div class="card"><h3>Scan / Enter QR</h3><div id="reader" style="max-width:420px"></div><label>QR Token / Pass Ref<input id="tokenInput" placeholder="YT:xxxx or pass ref"></label><button onclick="lookup()" style="margin-top:12px">Lookup</button></div><div class="card hidden" id="passCard"><h3>Pass</h3><div id="passInfo"></div><hr style="border-color:#2a2a31"><h3>Partial Redeem / Check-in</h3><div class="grid g3"><label>Pax<input id="apax" type="number" min="1"></label><label>Male<input id="amale" type="number" min="0"></label><label>Female<input id="afemale" type="number" min="0"></label></div><label>Table<input id="tableNo"></label><label>Remark<input id="checkRemark"></label><button onclick="partialRedeem()" style="margin-top:12px">Confirm Check-in</button><hr style="border-color:#2a2a31;margin:20px 0"><h3>Checkout</h3><label>Sales Amount (RM)<input id="salesAmount" type="number" min="0" step="0.01"></label><label class="row" style="margin-top:12px"><input id="finalPayment" type="checkbox" style="width:auto;margin:0"> Final payment / Close pass</label><button class="ok" onclick="checkout()" style="margin-top:12px">Confirm Payment & Redeem</button></div></div>
<div class="card" style="margin-top:16px"><h3>Recent Activity</h3><div id="recent"></div></div></div>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><script src="config.js"></script><script src="app.js"></script><script>
let current=null;if(requireRole('staff')){initScan();loadRecent()}
function initScan(){try{const qr=new Html5QrcodeScanner('reader',{fps:8,qrbox:220},false);qr.render((text)=>{$('#tokenInput').value=text;lookup();qr.clear().catch(()=>{})},()=>{})}catch(e){}}
async function lookup(){try{let t=$('#tokenInput').value.trim().replace(/^YT:/,'');current=await api('lookupPass',{token_or_ref:t});$('#passCard').classList.remove('hidden');renderPass()}catch(e){toast(e.message,'error')}}
function renderPass(){const p=current;$('#passInfo').innerHTML=`<div class="row between"><b>${p.pass_ref}</b><span class="pill">${p.status}</span></div><p>Ambassador: <b>${p.ambassador_name}</b></p><p>Label: ${p.label||'-'}</p><p>Plan: ${p.planned_pax} pax (${p.planned_male}M/${p.planned_female}F)</p><p>Actual so far: <b>${p.actual_pax||0}</b> pax (${p.actual_male||0}M/${p.actual_female||0}F)</p><p>Sales so far: <b>${money(p.sales||0)}</b></p>`}
async function partialRedeem(){try{const pax=+$('#apax').value,m=+$('#amale').value,f=+$('#afemale').value;if(m+f!==pax)throw new Error('Male + Female 必须等于 Pax');const d=await api('partialRedeem',{pass_id:current.pass_id,pax,male:m,female:f,table_no:$('#tableNo').value,remark:$('#checkRemark').value});toast('Check-in successful','success');current=d.pass;renderPass();loadRecent()}catch(e){toast(e.message,'error')}}
async function checkout(){try{const amt=+$('#salesAmount').value;if(!(amt>0))throw new Error('请输入 Sales Amount');const d=await api('checkout',{pass_id:current.pass_id,sales_amount:amt,final_payment:$('#finalPayment').checked?'1':'0',table_no:$('#tableNo').value});toast(`Redeem successful · ${d.redeem_ref} · Commission ${money(d.commission)}`,'success');current=d.pass;renderPass();$('#salesAmount').value='';loadRecent()}catch(e){toast(e.message,'error')}}
async function loadRecent(){try{const d=await api('staffRecent');$('#recent').innerHTML=`<table><tr><th>Ref</th><th>Pass</th><th>Sales</th><th>Time</th></tr>${d.map(x=>`<tr><td>${x.redeem_ref}</td><td>${x.pass_ref}</td><td>${money(x.sales_amount)}</td><td>${fmtDate(x.created_at)}</td></tr>`).join('')}</table>`}catch(e){}}
</script></body></html>
