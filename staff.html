<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yetipsy Staff</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div class="topbar"><div><div class="brand">Staff</div><div class="sub">Hi, <span id="who"></span></div></div><button class="btn2" onclick="logout()">Logout</button></div><div id="notice"></div>
<div class="grid g2"><div class="card compact-card"><div class="row between"><h3 class="section-title">Scan Pass</h3><span id="scanState" class="badge">Ready</span></div><div id="reader" style="max-width:360px"></div><div class="scan-status">扫到 QR 后会直接显示资料，不需要再按 Lookup。</div><div class="inline-search tight"><label style="margin:0">QR 扫不上？输入 Ref<input id="tokenInput" class="mini-input" placeholder="YT-G-XXXXXX" onkeydown="if(event.key==='Enter')manualLookup()"></label><button class="btn2" onclick="manualLookup()">Search</button></div></div>
<div class="card compact-card hidden" id="passCard"><div class="row between"><h3 class="section-title">Pass Info</h3><button class="btn2 scan-next" onclick="scanNext()">Scan Next</button></div><div id="passInfo"></div><hr class="line"><h3 class="section-title">Actual Arrival</h3><div class="compact-grid"><label>Male<input id="amale" type="number" min="0" value="0"></label><label>Female<input id="afemale" type="number" min="0" value="0"></label><label>Pax<input id="apax" type="number" readonly value="0"></label></div><div class="compact-grid two"><label>Table<input id="tableNo" placeholder="T03"></label><label>Remark<input id="checkRemark" placeholder="Optional"></label></div><div id="batchPreview" class="pricebox"></div><button onclick="partialRedeem()" style="margin-top:10px">Confirm Check-in</button><hr class="line"><div class="row between"><h3 class="section-title">Checkout</h3><label class="row" style="margin:0"><input id="finalPayment" type="checkbox" style="width:auto;margin:0"> Close pass</label></div><div id="checkoutPreview" class="pricebox"></div><button class="ok" onclick="checkout()" style="margin-top:10px">Confirm Payment & Credit Wallet</button></div></div>
<div class="card compact-card" style="margin-top:12px"><h3 class="section-title">Recent Redeems</h3><div id="recent" class="table-scroll"></div></div></div>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><script src="config.js"></script><script src="app.js"></script><script>
let current=null,scanner=null,scanning=false;if(requireRole('staff')){startScanner();loadRecent();['amale','afemale'].forEach(id=>$('#'+id).addEventListener('input',syncPax))}
function startScanner(){if(scanning)return;scanning=true;$('#scanState').textContent='Scanning';try{scanner=new Html5QrcodeScanner('reader',{fps:10,qrbox:210,rememberLastUsedCamera:true},false);scanner.render(async text=>{if(!scanning)return;scanning=false;$('#scanState').textContent='Loading';try{await scanner.clear()}catch(e){} await loadPass(text)},()=>{})}catch(e){scanning=false;$('#scanState').textContent='Camera unavailable'}}
async function loadPass(raw){try{const t=String(raw||'').trim().replace(/^YT:/,'');current=await api('lookupPass',{token_or_ref:t});$('#passCard').classList.remove('hidden');$('#scanState').textContent='Loaded';renderPass();$('#passCard').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){toast(e.message,'error');$('#scanState').textContent='Ready';startScanner()}}
async function manualLookup(){const v=$('#tokenInput').value.trim();if(!v)return;await loadPass(v)}
function scanNext(){current=null;$('#passCard').classList.add('hidden');$('#tokenInput').value='';$('#amale').value='0';$('#afemale').value='0';$('#apax').value='0';$('#tableNo').value='';$('#checkRemark').value='';$('#scanState').textContent='Ready';$('#reader').innerHTML='';startScanner()}
function renderPass(){const p=current;$('#passInfo').innerHTML=`<div class="row between"><b>${esc(p.pass_ref)}</b><span class="pill">${esc(p.status)}</span></div><div class="pass-summary"><div class="summary-cell"><div class="k">Ambassador</div><div class="v">${esc(p.ambassador_name)}</div></div><div class="summary-cell"><div class="k">Date</div><div class="v">${esc(p.reservation_date)}</div></div><div class="summary-cell"><div class="k">Reserved</div><div class="v">${Number(p.planned_pax||0)} pax</div></div><div class="summary-cell"><div class="k">Actual</div><div class="v">${Number(p.actual_pax||0)} · ${Number(p.actual_male||0)}M/${Number(p.actual_female||0)}F</div></div></div><div class="price-pair tight"><div class="price-chip"><div class="k">Male Price</div><div class="v">${money(p.male_price)}</div></div><div class="price-chip"><div class="k">Female Price</div><div class="v">${money(p.female_price)}</div></div></div><div class="muted small tight">${esc(p.price_source||'')} ${p.price_note?'· '+esc(p.price_note):''} · Sales credited ${money(p.sales||0)}</div>`;syncPax()}
function syncPax(){const m=Math.max(0,Number($('#amale').value||0)),f=Math.max(0,Number($('#afemale').value||0));$('#apax').value=m+f;updatePreview()}
function updatePreview(){if(!current)return;const m=Number($('#amale').value||0),f=Number($('#afemale').value||0),mp=Number(current.male_price||0),fp=Number(current.female_price||0);$('#batchPreview').innerHTML=`This batch: <b>${m}M × ${money(mp)} + ${f}F × ${money(fp)} = ${money(m*mp+f*fp)}</b>`;const total=Number(current.actual_male||0)*mp+Number(current.actual_female||0)*fp,already=Number(current.sales||0),due=Math.max(0,Math.round((total-already)*100)/100);$('#checkoutPreview').innerHTML=`Actual: ${Number(current.actual_male||0)}M × ${money(mp)} + ${Number(current.actual_female||0)}F × ${money(fp)} = <b>${money(total)}</b><br>Already credited ${money(already)}<br><span class="bigdue">Amount due ${money(due)}</span>`}
async function partialRedeem(){try{const m=Number($('#amale').value||0),f=Number($('#afemale').value||0),pax=m+f;if(!(pax>0))throw new Error('请输入男女人数');const d=await api('partialRedeem',{pass_id:current.pass_id,pax,male:m,female:f,table_no:$('#tableNo').value,remark:$('#checkRemark').value});toast('Check-in successful','success');current=d.pass;$('#amale').value='0';$('#afemale').value='0';$('#apax').value='0';$('#checkRemark').value='';renderPass();loadRecent()}catch(e){toast(e.message,'error')}}
async function checkout(){try{const mp=Number(current.male_price||0),fp=Number(current.female_price||0),total=Number(current.actual_male||0)*mp+Number(current.actual_female||0)*fp,due=Math.round((total-Number(current.sales||0))*100)/100;if(!(due>0))throw new Error('目前没有新的应收金额');if(!confirm(`确认收款 ${money(due)}？\n确认后才会进入 Ambassador Sales / Wallet。`))return;const d=await api('checkout',{pass_id:current.pass_id,final_payment:$('#finalPayment').checked?'1':'0',table_no:$('#tableNo').value});toast(`Paid ${money(d.sales_amount)} · ${d.redeem_ref}`,'success');current=d.pass;$('#finalPayment').checked=false;renderPass();loadRecent()}catch(e){toast(e.message,'error')}}
async function loadRecent(){try{const d=await api('staffRecent');$('#recent').innerHTML=`<table><tr><th>Ref</th><th>Pass</th><th>M/F</th><th>Sales</th><th>Time</th></tr>${d.map(x=>`<tr><td>${esc(x.redeem_ref)}</td><td>${esc(x.pass_ref)}</td><td>${Number(x.male_charged||0)}/${Number(x.female_charged||0)}</td><td>${money(x.sales_amount)}</td><td>${fmtDate(x.created_at)}</td></tr>`).join('')}</table>`}catch(e){}}
</script></body></html>
