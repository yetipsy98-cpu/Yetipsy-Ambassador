<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yetipsy Staff</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div class="topbar"><div><div class="brand">Staff</div><div class="sub">Hi, <span id="who"></span></div></div><button class="btn2" onclick="logout()">Logout</button></div><div id="notice"></div>
<div class="grid g2"><div class="card"><h3>Scan / Enter QR</h3><div id="reader" style="max-width:420px"></div><label>QR Token / Pass Ref<input id="tokenInput" placeholder="YT:xxxx or pass ref"></label><button onclick="lookup()" style="margin-top:12px">Lookup</button></div><div class="card hidden" id="passCard"><h3>Reservation</h3><div id="passInfo"></div><hr class="line"><h3>Partial Redeem / Actual Arrival</h3><div class="grid g3"><label>Pax<input id="apax" type="number" min="1"></label><label>Male<input id="amale" type="number" min="0" value="0"></label><label>Female<input id="afemale" type="number" min="0" value="0"></label></div><label>Table<input id="tableNo" placeholder="e.g. T03"></label><label>Remark<input id="checkRemark" placeholder="Optional"></label><div id="batchPreview" class="pricebox"></div><button onclick="partialRedeem()" style="margin-top:12px">Confirm Check-in</button><hr class="line"><h3>Checkout</h3><div id="checkoutPreview" class="pricebox"></div><label class="row" style="margin-top:12px"><input id="finalPayment" type="checkbox" style="width:auto;margin:0"> Final payment / Close pass</label><button class="ok" onclick="checkout()" style="margin-top:12px">Confirm Payment & Credit Wallet</button></div></div>
<div class="card" style="margin-top:16px"><h3>Recent Redeems</h3><div id="recent"></div></div></div>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><script src="config.js"></script><script src="app.js"></script><script>
let current=null;if(requireRole('staff')){initScan();loadRecent();['apax','amale','afemale'].forEach(id=>$('#'+id).addEventListener('input',updatePreview))}
function initScan(){try{const qr=new Html5QrcodeScanner('reader',{fps:8,qrbox:220},false);qr.render((text)=>{$('#tokenInput').value=text;lookup();qr.clear().catch(()=>{})},()=>{})}catch(e){}}
async function lookup(){try{let t=$('#tokenInput').value.trim().replace(/^YT:/,'');current=await api('lookupPass',{token_or_ref:t});$('#passCard').classList.remove('hidden');renderPass()}catch(e){toast(e.message,'error')}}
function renderPass(){const p=current,price=p.price_per_pax;$('#passInfo').innerHTML=`<div class="row between"><b>${esc(p.pass_ref)}</b><span class="pill">${esc(p.status)}</span></div><p>Ambassador: <b>${esc(p.ambassador_name)}</b></p><p>Date: <b>${esc(p.reservation_date)}</b></p><p>Reserved: <b>${Number(p.planned_pax||0)} pax</b></p><p>Actual so far: <b>${Number(p.actual_pax||0)}</b> pax (${Number(p.actual_male||0)}M/${Number(p.actual_female||0)}F)</p><p>Daily price: <b>${price===null?'NOT SET':money(price)+' / pax'}</b>${p.price_note?` · ${esc(p.price_note)}`:''}</p><p>Sales credited: <b>${money(p.sales||0)}</b></p>`;updatePreview()}
function updatePreview(){if(!current)return;const pax=Number($('#apax').value||0),price=current.price_per_pax;$('#batchPreview').innerHTML=price===null?'<b>当天价格未设置</b>':`This batch: <b>${pax} pax × ${money(price)} = ${money(pax*price)}</b>`;const total=Number(current.actual_pax||0)*Number(price||0),already=Number(current.sales||0),due=Math.max(0,total-already);$('#checkoutPreview').innerHTML=price===null?'<b>Admin 必须先设置当天价格才能结账。</b>':`Actual ${Number(current.actual_pax||0)} pax × ${money(price)} = <b>${money(total)}</b><br>Already credited ${money(already)}<br><span class="bigdue">Amount due ${money(due)}</span>`}
async function partialRedeem(){try{const pax=Number($('#apax').value),m=Number($('#amale').value),f=Number($('#afemale').value);if(!(pax>0))throw new Error('请输入实际人数');if(m+f!==pax)throw new Error('男 + 女必须等于实际人数');const d=await api('partialRedeem',{pass_id:current.pass_id,pax,male:m,female:f,table_no:$('#tableNo').value,remark:$('#checkRemark').value});toast('Check-in successful','success');current=d.pass;$('#apax').value='';$('#amale').value='0';$('#afemale').value='0';$('#checkRemark').value='';renderPass();loadRecent()}catch(e){toast(e.message,'error')}}
async function checkout(){try{if(current.price_per_pax===null)throw new Error('Admin 尚未设置当天价格');const total=Number(current.actual_pax||0)*Number(current.price_per_pax||0),due=Math.round((total-Number(current.sales||0))*100)/100;if(!(due>0))throw new Error('目前没有新的应收金额');if(!confirm(`确认收款 ${money(due)}？\n只有确认后 Commission 才进入 Ambassador Wallet。`))return;const d=await api('checkout',{pass_id:current.pass_id,final_payment:$('#finalPayment').checked?'1':'0',table_no:$('#tableNo').value});toast(`Paid ${money(d.sales_amount)} · Ref ${d.redeem_ref}`,'success');current=d.pass;renderPass();$('#finalPayment').checked=false;loadRecent()}catch(e){toast(e.message,'error')}}
async function loadRecent(){try{const d=await api('staffRecent');$('#recent').innerHTML=`<table><tr><th>Ref</th><th>Pass</th><th>Pax</th><th>Price</th><th>Sales</th><th>Time</th></tr>${d.map(x=>`<tr><td>${esc(x.redeem_ref)}</td><td>${esc(x.pass_ref)}</td><td>${x.pax_charged||'-'}</td><td>${money(x.price_per_pax)}</td><td>${money(x.sales_amount)}</td><td>${fmtDate(x.created_at)}</td></tr>`).join('')}</table>`}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
