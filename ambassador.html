<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yetipsy Ambassador</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div class="topbar"><div><div class="brand">Ambassador</div><div class="sub">Hi, <span id="who"></span></div></div><button class="btn2" onclick="logout()">Logout</button></div><div id="notice"></div>
<div class="grid g3"><div class="card"><div class="label">Redeemed Sales</div><div class="stat" id="sales">RM 0.00</div></div><div class="card"><div class="label">Wallet</div><div class="stat" id="wallet">RM 0.00</div></div><div class="card"><div class="label">Redeemed / Issued</div><div class="stat" id="count">0 / 0</div></div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Issue Guest Pass</h3><label>Reservation Date *<input id="rdate" type="date"></label><label>Pax *<input id="pax" type="number" min="1" value="1" required></label><label>Type<select id="ptype"><option value="GROUP">Group</option><option value="INDIVIDUAL">Individual</option></select></label><label>Label / Name<input id="label" placeholder="e.g. Friday Group A"></label><label>Remark<textarea id="remark" placeholder="Optional"></textarea></label><button style="margin-top:14px" onclick="createPass()">Generate QR</button><div id="qrResult" class="hidden" style="margin-top:16px"><div id="qrcode" class="qrbox"></div><div class="mono" id="passref" style="margin-top:10px"></div></div></div>
<div class="card"><h3>My Passes</h3><div class="muted" style="margin-bottom:10px">未开始 Check-in 的预定可以修改。</div><div id="passes" class="list"></div></div></div>
<div class="card hidden" id="editCard" style="margin-top:16px"><h3>Edit Reservation</h3><input id="editId" type="hidden"><div class="grid g2"><label>Date *<input id="editDate" type="date"></label><label>Pax *<input id="editPax" type="number" min="1"></label></div><label>Type<select id="editType"><option value="GROUP">Group</option><option value="INDIVIDUAL">Individual</option></select></label><label>Label / Name<input id="editLabel"></label><label>Remark<textarea id="editRemark"></textarea></label><div class="row" style="margin-top:14px"><button onclick="saveEdit()">Save Changes</button><button class="btn2" onclick="cancelEdit()">Cancel</button></div></div>
<div class="card" style="margin-top:16px"><h3>Wallet History</h3><div id="walletList"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="config.js"></script><script src="app.js"></script><script>
let dashboard=null;if(requireRole('ambassador')){setDefaultDate();load()}
function setDefaultDate(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('#rdate').value=d.toISOString().slice(0,10)}
async function load(){try{const d=await api('ambassadorDashboard');dashboard=d;$('#sales').textContent=money(d.sales);$('#wallet').textContent=money(d.wallet);$('#count').textContent=`${d.redeemed_count} / ${d.issued_count}`;$('#passes').innerHTML=d.passes.map(p=>`<div class="item"><div class="row between"><b>${esc(p.label||p.pass_ref)}</b><span class="pill">${esc(p.status)}</span></div><div class="muted">${esc(p.reservation_date)} · ${esc(p.type)} · ${esc(p.pass_ref)}</div><div style="margin-top:6px">Reserved: <b>${Number(p.planned_pax||0)} pax</b></div><div>Actual: ${Number(p.actual_pax||0)} pax (${Number(p.actual_male||0)}M/${Number(p.actual_female||0)}F)</div><div>Sales: <b>${money(p.sales||0)}</b></div><div class="row" style="margin-top:8px"><button class="btn2" onclick="showQR('${p.qr_token}','${p.pass_ref}')">Show QR</button>${p.can_edit?`<button class="btn2" onclick="editPass('${p.pass_id}')">Edit</button>`:''}</div></div>`).join('')||'<div class="muted">No passes yet</div>';$('#walletList').innerHTML=`<table><tr><th>Ref</th><th>Type</th><th>Amount</th><th>Time</th></tr>${d.wallet_history.map(x=>`<tr><td>${esc(x.redeem_ref||'-')}</td><td>${esc(x.type)}</td><td class="money">${money(x.amount)}</td><td>${fmtDate(x.created_at)}</td></tr>`).join('')}</table>`}catch(e){toast(e.message,'error')}}
async function createPass(){try{const pax=Number($('#pax').value);if(!(pax>0))throw new Error('请填写人数');if(!$('#rdate').value)throw new Error('请选择日期');const d=await api('createPass',{type:$('#ptype').value,label:$('#label').value,reservation_date:$('#rdate').value,planned_pax:pax,remark:$('#remark').value});showQR(d.qr_token,d.pass_ref);$('#label').value='';$('#remark').value='';load()}catch(e){toast(e.message,'error')}}
function showQR(token,ref){$('#qrResult').classList.remove('hidden');$('#qrcode').innerHTML='';new QRCode($('#qrcode'),{text:'YT:'+token,width:220,height:220});$('#passref').textContent=ref;$('#qrResult').scrollIntoView({behavior:'smooth',block:'center'})}
function editPass(id){const p=dashboard.passes.find(x=>x.pass_id===id);if(!p)return;$('#editId').value=p.pass_id;$('#editDate').value=p.reservation_date;$('#editPax').value=p.planned_pax;$('#editType').value=p.type;$('#editLabel').value=p.label||'';$('#editRemark').value=p.remark||'';$('#editCard').classList.remove('hidden');$('#editCard').scrollIntoView({behavior:'smooth'})}
function cancelEdit(){$('#editCard').classList.add('hidden')}
async function saveEdit(){try{await api('updatePass',{pass_id:$('#editId').value,reservation_date:$('#editDate').value,planned_pax:$('#editPax').value,type:$('#editType').value,label:$('#editLabel').value,remark:$('#editRemark').value});toast('Reservation updated','success');cancelEdit();load()}catch(e){toast(e.message,'error')}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
