<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ambassador</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div class="topbar"><div><div class="brand">Ambassador</div><div class="sub">Hi, <span id="who"></span></div></div><button class="btn2" onclick="logout()">Logout</button></div><div id="notice"></div>
<div class="grid g3"><div class="card"><div class="label">Redeemed Sales</div><div class="stat" id="sales">RM 0.00</div></div><div class="card"><div class="label">Wallet</div><div class="stat" id="wallet">RM 0.00</div></div><div class="card"><div class="label">Redeemed / Issued</div><div class="stat" id="count">0 / 0</div></div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Issue Guest Pass</h3><label>Type<select id="ptype"><option value="INDIVIDUAL">Individual</option><option value="GROUP">Group</option></select></label><label>Label / Name<input id="label" placeholder="e.g. Friday Group A"></label><div class="grid g3"><label>Pax<input id="pax" type="number" min="1" value="1"></label><label>Male<input id="male" type="number" min="0" value="0"></label><label>Female<input id="female" type="number" min="0" value="1"></label></div><label>Remark<textarea id="remark"></textarea></label><button style="margin-top:14px" onclick="createPass()">Generate QR</button><div id="qrResult" class="hidden" style="margin-top:16px"><div id="qrcode" class="qrbox"></div><div class="mono" id="passref" style="margin-top:10px"></div></div></div>
<div class="card"><h3>My Passes</h3><div id="passes" class="list"></div></div></div>
<div class="card" style="margin-top:16px"><h3>Wallet History</h3><div id="walletList"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="config.js"></script><script src="app.js"></script><script>
if(requireRole('ambassador')) load();
async function load(){try{const d=await api('ambassadorDashboard');$('#sales').textContent=money(d.sales);$('#wallet').textContent=money(d.wallet);$('#count').textContent=`${d.redeemed_count} / ${d.issued_count}`;$('#passes').innerHTML=d.passes.map(p=>`<div class="item"><div class="row between"><b>${p.label||p.pass_ref}</b><span class="pill">${p.status}</span></div><div class="muted">${p.type} · ${p.pass_ref}</div><div>Plan: ${p.planned_pax} pax (${p.planned_male}M/${p.planned_female}F)</div><div>Actual: ${p.actual_pax||0} pax · Sales ${money(p.sales||0)}</div><button class="btn2" style="margin-top:8px" onclick="showQR('${p.qr_token}','${p.pass_ref}')">Show QR</button></div>`).join('')||'<div class="muted">No passes yet</div>';$('#walletList').innerHTML=`<table><tr><th>Ref</th><th>Type</th><th>Amount</th><th>Time</th></tr>${d.wallet_history.map(x=>`<tr><td>${x.redeem_ref||'-'}</td><td>${x.type}</td><td class="money">${money(x.amount)}</td><td>${fmtDate(x.created_at)}</td></tr>`).join('')}</table>`}catch(e){toast(e.message,'error')}}
async function createPass(){try{const d=await api('createPass',{type:$('#ptype').value,label:$('#label').value,planned_pax:$('#pax').value,planned_male:$('#male').value,planned_female:$('#female').value,remark:$('#remark').value});showQR(d.qr_token,d.pass_ref);load()}catch(e){toast(e.message,'error')}}
function showQR(token,ref){$('#qrResult').classList.remove('hidden');$('#qrcode').innerHTML='';new QRCode($('#qrcode'),{text:'YT:'+token,width:220,height:220});$('#passref').textContent=ref}
</script></body></html>
